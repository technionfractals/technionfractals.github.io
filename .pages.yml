media:
  - name: materials
    label: Public
    input: public
    output: /

content:
  - name: talks
    label: Talks
    type: collection
    path: src/content/talks
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{title}.md"
    view:
      fields: [title, speaker, date, status]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: speaker, label: Speaker, type: string, required: true }
      - { name: affiliation, label: Affiliation, type: string }
      - { name: date, label: Date, type: date, options: { time: false, format: "yyyy-MM-dd" }, required: true }
      - name: startTime
        label: Start time
        type: date
        default: ""
        required: true
        options:
          time: true
          format: "HH:mm"
          step: 300
      - name: endTime
        label: End time
        type: date
        default: ""
        required: true
        options:
          time: true
          format: "HH:mm"
          step: 300
      - name: timezone
        label: Time zone
        type: string
        default: Asia/Jerusalem
        required: true
        description: "IANA time zone; the Haifa default is Asia/Jerusalem"
      - name: showTimezone
        label: Show time zone
        type: boolean
        default: false
      - { name: venue, label: Venue, type: string, required: true, description: "Compact format: RM 864, Amado" }
      - name: status
        label: Status
        type: select
        default: draft
        options:
          values: [draft, published, cancelled]
      - { name: speakerUrl, label: Speaker webpage, type: string }
      - name: tags
        label: Tags
        type: string
        list: true
        description: "Search keywords that are not displayed on the website"
      - name: resources
        label: Additional information
        type: block
        list:
          collapsible:
            collapsed: true
            summary: "{type}: {label}"
        blockKey: type
        blocks:
          - name: link
            label: Link
            fields:
              - { name: label, label: Label, type: string, required: true }
              - { name: url, label: URL, type: string, required: true }
          - name: note
            label: Note
            fields:
              - { name: label, label: Label, type: string, default: "Note", required: true }
              - { name: text, label: Text, type: rich-text, required: true }
          - name: text
            label: Text
            fields:
              - { name: text, label: Text, type: rich-text, required: true }
      - { name: body, label: Abstract, type: rich-text, required: true }

  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: general
        label: General
        type: object
        fields:
          - { name: title, label: Site title, type: string, required: true }
      - name: upcoming
        label: Upcoming
        type: object
        fields:
          - { name: description, label: Upcoming Page Description, type: text, required: true }
      - name: submit
        label: Submit
        type: object
        fields:
          - { name: formUrl, label: Submission form URL, type: string }
      - name: about
        label: About
        type: object
        fields:
          - { name: description, label: About Page Description, type: text, required: true }
          - name: participants
            label: Regular participants
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - { name: name, label: Name, type: string, required: true }
              - { name: url, label: Homepage, type: string }
              - { name: email, label: Email, type: string }
              - name: showEmail
                label: Show email in participant list
                type: boolean
                default: false
          - name: contacts
            label: Contact
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}: {value}"
            fields:
              - { name: label, label: Label, type: string, required: true }
              - { name: value, label: Value, type: string, required: true }
